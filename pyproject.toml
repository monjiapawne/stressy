[project]
name = "stressy"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "pygobject>=3.58.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pygobject-stubs>=2.20.0",
]

[project.gui-scripts]
stressy = "stressy.__main__:main"

[tool.ruff]
line-length = 120

[tool.pyright]
reportMissingModuleSource = false
